[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniserve"
version = "0.1.0"
description = "High-throughput LLM gateway and fine-tuned SLM engine for structured JSON extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

# Heavy, platform-specific stacks stay optional so CI and laptops can install
# the gateway without pulling CUDA wheels.
[project.optional-dependencies]
data = [
    "openai>=1.40",
]
cache = [
    "redis>=5.0",
    "redisvl>=0.3",
    "sentence-transformers>=3.0",
]
engine = [
    "vllm>=0.6",
    "outlines>=0.1",
]
training = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "trl>=0.9",
]
observability = [
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "prometheus-client>=0.20",
]
dev = [
    "black>=24.4",
    "flake8>=7.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "locust>=2.29",
]

[tool.setuptools.packages.find]
include = ["gateway*", "data*", "benchmarks*", "training*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
